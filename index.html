<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Notify me</title>
      <style>
         body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 100px auto;
            max-width: 320px;
         }
      </style>
   </head>
   <body>
      <div id="notification-widget">
         <button id="popup-open" class="notification-btn" type="button" data-type="notify-me" data-fields='["email", "firstName", "lastName"]'>Notify Me - Join Waitlist</button>
      </div>

      <!-- Mock product so the demo popup can populate (Shopify provides this on the storefront). -->
      <script>
         window.currentProduct = {
            id: 123456789,
            title: 'Sample Product',
            variants: [
               { id: 1, title: 'Small' },
               { id: 2, title: 'Medium' },
               { id: 3, title: 'Large' },
            ],
         };
      </script>
      <!--
         Local verification harness. Not part of the shipped widget.
         Add ?mockRecs=1 to the URL to stub the recommendations API with a fixed
         payload, so the section can be checked without a live token. The payload
         deliberately repeats product_ref values (the real service returns one entry
         per variant) so deduping is exercised.
      -->

            window.fetch = function (input, init) {
               var url = typeof input === 'string' ? input : input.url;
               if (url && url.indexOf('/services/recommendations/') !== -1) {
                  console.log('[mockRecs] intercepted', url);
                  return Promise.resolve(
                     new Response(JSON.stringify(MOCK_RECS), {
                        status: 200,
                        headers: { 'Content-Type': 'application/json' },
                     }),
                  );
               }
               return realFetch(input, init);
            };
         }
